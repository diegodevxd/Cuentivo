# Build de iOS en un runner macOS de GitHub Actions.
#
# Es la pieza que hace posible el plan sin Mac: el compilador de Kotlin para iOS exige macOS, y
# aquí la Mac la pone GitHub por minutos. No hay firma ni secretos: con CODE_SIGNING_ALLOWED=NO
# compila y deja el .app del simulador como artifact, que es lo que hoy se puede verificar.
#
# Se dispara a mano y sólo con push a esta rama: los minutos de macOS cuestan 10x en repos privados.
name: ios-build

on:
  workflow_dispatch:
  push:
    branches:
      - diegodevxd/cuentivo-ios

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Una sola imagen. macos-15 y macos-14 no consiguen runner para este repositorio y sólo dejan
    # jobs cancelados en el resultado; macos-26 es la que sí arranca.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ~/.konan es el compilador y las dependencias de Kotlin/Native: sin caché son varios minutos.
      - name: Caché de Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Pruebas del código común en iOS
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon --console=plain

      # Los mensajes de las aserciones sólo quedan en estos XML, no en el log.
      - name: Subir resultados de las pruebas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-ios-${{ matrix.os }}
          path: shared/build/test-results/iosSimulatorArm64Test
          if-no-files-found: warn

      # Firebase lo lee del bundle al arrancar; sin este archivo la app compila y truena en el
      # primer `FirebaseApp.configure()`. El plist es un secreto: no está en el repo.
      - name: GoogleService-Info.plist desde el secreto
        if: ${{ !cancelled() }}
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::error::Falta el secreto GOOGLE_SERVICE_INFO_PLIST"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist

      # El REVERSED_CLIENT_ID del plist es el URL scheme de Google, y el plist no va al repo: se
      # escribe en el Info.plist sólo durante la corrida. Nunca se imprime el valor.
      - name: URL scheme de Google desde el plist
        if: ${{ !cancelled() }}
        run: |
          PLIST=iosApp/iosApp/GoogleService-Info.plist
          INFO=iosApp/iosApp/Info.plist
          REVERSED=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$PLIST" 2>/dev/null || true)
          if [ -z "$REVERSED" ]; then
            echo "::error::GoogleService-Info.plist sin REVERSED_CLIENT_ID: activar Google para iOS en Firebase y volver a descargarlo"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$INFO" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$INFO"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$INFO"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$INFO"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED" "$INFO"
      # Corre aunque falle una prueba: el job sigue en rojo, pero una sola corrida da los dos veredictos.
      - name: Compilar la app de iOS (sin firma)
        if: ${{ !cancelled() }}
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/iosDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build

      # Compilar no prueba que los textos lleguen al .app. Quien los copia es
      # `syncComposeResourcesForIos`, que cuelga de `:iosKit:embedAndSignAppleFrameworkForXcode`
      # (el plugin de Compose lo engancha en el proyecto que produce el framework). Si el paso no
      # corre, el build sale verde y la app truena al abrir con MissingResourceException.
      #
      # La búsqueda es recursiva a propósito: en un proyecto multimódulo los recursos de `:shared`
      # se aíslan bajo su paquete (`compose-resources/com.cuentivo.shared.resources/...`), así que
      # la ruta exacta no es estable; lo que sí es estable es que haya un `values-en` de `strings`.
      - name: El .app lleva los recursos de Compose
        if: ${{ !cancelled() }}
        run: |
          APP=build/iosDerivedData/Build/Products/Debug-iphonesimulator/Cuentivo.app
          if [ ! -d "$APP" ]; then
            echo "::error::No hay $APP: xcodebuild no produjo la app, así que no se pueden verificar los recursos"
            exit 1
          fi
          ROOT=$(find "$APP" -type d -name 'compose-resources' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "::error::El .app no contiene ningún directorio compose-resources: syncComposeResourcesForIos no corrió"
            find "$APP" -maxdepth 2 -type d | sort | head -n 40
            exit 1
          fi
          EN=$(find "$ROOT" -type f -path '*/values-en/*' -name 'strings*' | head -n 1)
          if [ -z "$EN" ]; then
            echo "::error::compose-resources existe en $ROOT pero no lleva un strings de values-en"
            find "$ROOT" -maxdepth 3 | sort | head -n 40
            exit 1
          fi
          echo "Recursos de Compose en el .app: $EN"

      - name: Subir el .app del simulador
        uses: actions/upload-artifact@v4
        with:
          name: Cuentivo-ios-simulator-${{ matrix.os }}
          path: build/iosDerivedData/Build/Products/Debug-iphonesimulator/Cuentivo.app
          if-no-files-found: error
