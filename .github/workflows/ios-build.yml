# Build de iOS en un runner macOS de GitHub Actions.
#
# Es la pieza que hace posible el plan sin Mac: el compilador de Kotlin para iOS exige macOS, y
# aquí la Mac la pone GitHub por minutos. No hay firma ni secretos: con CODE_SIGNING_ALLOWED=NO
# compila y deja el .app del simulador como artifact, que es lo que hoy se puede verificar.
#
# Se dispara a mano y sólo con push a esta rama: los minutos de macOS cuestan 10x en repos privados.
name: ios-build

on:
  workflow_dispatch:
  push:
    branches:
      - diegodevxd/cuentivo-ios

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ~/.konan es el compilador y las dependencias de Kotlin/Native: sin caché son varios minutos.
      - name: Caché de Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Pruebas del código común en iOS
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon --console=plain

      - name: Compilar la app de iOS (sin firma)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/iosDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Subir el .app del simulador
        uses: actions/upload-artifact@v4
        with:
          name: Cuentivo-ios-simulator
          path: build/iosDerivedData/Build/Products/Debug-iphonesimulator/Cuentivo.app
          if-no-files-found: error
