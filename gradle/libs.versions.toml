[versions]
agp = "9.3.0"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
room = "2.7.2"
ksp = "2.3.13"
sqlite = "2.5.1"
kotlinxDatetime = "0.6.2"
composeMultiplatform = "1.9.3"
# Congelada a propósito: es la última versión publicada de los íconos Material para comunes.
# Compose Multiplatform 1.8.2 quitó la dependencia implícita en `material-icons-core` y su propia
# documentación manda añadirla explícitamente con esta coordenada (What's new in 1.8.2 › Implicit
# dependency on material-icons-core removed). No se sube: por encima de 1.7.3 no existe.
composeMaterialIcons = "1.7.3"
gitlive = "2.8.0"
# Version que YA resuelve el grafo (:shared:dependencyInsight --dependency kotlinx-coroutines-core):
# 1.8.1. No se sube: solo se declara para no depender de una transitiva de Compose.
coroutines = "1.8.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
# GitLive: Firebase para Kotlin Multiplatform. Solo lo usa :iosKit; :shared no lo toca.
firebase-auth = { group = "dev.gitlive", name = "firebase-auth", version.ref = "gitlive" }
firebase-firestore = { group = "dev.gitlive", name = "firebase-firestore", version.ref = "gitlive" }
firebase-functions = { group = "dev.gitlive", name = "firebase-functions", version.ref = "gitlive" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
# `Icons.Filled.*` en commonMain. Android redirige a androidx.compose.material:material-icons-core
# (lo fija el BOM de :app); iOS usa el klib `uikitSimArm64`/`uikitArm64` de esta misma versión.
compose-material-icons-core = { group = "org.jetbrains.compose.material", name = "material-icons-core", version.ref = "composeMaterialIcons" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9: el plugin Android para librerías Kotlin Multiplatform. No es `com.android.library`.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
